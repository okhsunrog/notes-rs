[package]
name = "notes-rs"
default-run = "notes-rs"
version.workspace = true
description = "A graph-native personal knowledge app with hybrid retrieval and agentic RAG"
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notes_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
notes-ai.workspace = true
notes-core.workspace = true
notes-sync.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "40a7b831b0493ac2be7bc7bfd55980d5a6802044", features = [
  "typescript",
  "derive",
] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3.23"
uuid.workspace = true
url.workspace = true
chrono.workspace = true
llm-relay.workspace = true
futures.workspace = true
schemars.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
base64 = "0.22.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-mcp-bridge = "0.12.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2.7.1"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-mobile-system = { path = "../plugins/tauri-plugin-mobile-system" }
tauri-plugin-android-fs = "28.4.0"
tracing-logcat = "0.1.0"

[features]
default = []
# Compile in the fastembed-based local embedder + reranker. Adds ~300 MB of
# transitive deps (ort, hf-hub, tokenizers). Off by default — cloud providers
# (OpenRouter, OpenAI, etc.) are the supported path. Enable with
# `--features local-models` if you want offline-capable embedding/rerank.
local-models = ["notes-ai/local-models"]

[dev-dependencies]
tempfile.workspace = true
