[package]
name = "notes-rs"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notes_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-mcp-bridge = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.40.1", default-features = false, features = [
  "bundled",
  "load_extension",
] }
sqlite-vec = "0.1.9"
tokio = { version = "1.52.4", features = ["full"] }
fastembed = { version = "5.17.3", optional = true }
anyhow = "1.0.103"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
async-channel = "2.5.0"
rig = { package = "rig-core", version = "0.40.0" }
futures = "0.3.32"
async-trait = "0.1.89"
reqwest = { version = "0.13.4", default-features = false }
schemars = "1.2.1"
rust-stemmers = "1.2.0"
dotenvy = "0.15.7"
sha1 = "0.11.0"

[features]
default = []
# Compile in the fastembed-based local embedder + reranker. Adds ~300 MB of
# transitive deps (ort, hf-hub, tokenizers). Off by default — cloud providers
# (OpenRouter, OpenAI, etc.) are the supported path. Enable with
# `--features local-models` if you want offline-capable embedding/rerank.
local-models = ["dep:fastembed"]

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
