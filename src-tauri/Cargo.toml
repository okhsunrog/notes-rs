[package]
name = "tangleaf"
default-run = "tangleaf"
version.workspace = true
description = "A graph-native personal knowledge app with hybrid retrieval and agentic RAG"
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tangleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
notes-blob.workspace = true
notes-core.workspace = true
notes-protocol.workspace = true
notes-sync.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "40a7b831b0493ac2be7bc7bfd55980d5a6802044", features = [
  "typescript",
  "derive",
] }
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3.23"
uuid.workspace = true
url.workspace = true
chrono.workspace = true
futures.workspace = true
image = { version = "=0.25.10", default-features = false, features = [
  "gif",
  "jpeg",
  "png",
  "webp",
] }
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tempfile.workspace = true
zenwebp = "0.4.4"
ink-format = { version = "0.1.0", path = "../crates/ink-format" }
rusqlite.workspace = true

[target.'cfg(not(target_os = "ios"))'.dependencies]
tauri-plugin-mcp-bridge = { git = "https://github.com/okhsunrog/mcp-server-tauri.git", rev = "012b3893b1422c2deeb81f997cba736125c84804" }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Direct filesystem importers (Logseq today, Obsidian later) are desktop-only.
notes-import.workspace = true
tauri-plugin-dialog = "2.7.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
rustls-platform-verifier = "0.7.0"
tauri-plugin-mobile-system = { path = "../plugins/tauri-plugin-mobile-system" }
tauri-plugin-android-fs = "28.4.0"
tracing-logcat = "0.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6.2"
